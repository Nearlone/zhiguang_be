
spring:
  application:
    name: zhiguang-auth
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/zhiguang?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:Root@123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20             # 连接池最大连接数
      minimum-idle: 5                   # 最小空闲连接
      idle-timeout: 600000              # 10 分钟：空闲多久回收
      max-lifetime: 1700000             # 约 28 分钟
      keepalive-time: 300000            # 5 分钟发一次“保活”
      connection-timeout: 30000             # 30 秒拿不到连接就报错
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    template:
      default-topic: counter-events
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      linger: 10ms
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: counter-agg
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
      enable-auto-commit: false
    listener:
      type: single
      ack-mode: manual
  ai:
    retry:
      # Spring AI 默认最多重试 10 次且退避较长；在线问答只做有限重试，避免故障时长时间占用请求线程。
      max-attempts: ${SPRING_AI_RETRY_MAX_ATTEMPTS:2}
      backoff:
        initial-interval: ${SPRING_AI_RETRY_INITIAL_INTERVAL:500ms}
        multiplier: ${SPRING_AI_RETRY_MULTIPLIER:2}
        max-interval: ${SPRING_AI_RETRY_MAX_INTERVAL:2s}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:local-dev-placeholder}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.8
    openai:
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${DASHSCOPE_API_KEY:local-dev-placeholder}
      embedding:
        options:
          model: text-embedding-v4 # 向量模型
          dimensions: 1536
    vectorstore:
      elasticsearch:
        initialize-schema: true
        index-name: zhiguang-ai-index
        dimensions: 1536 # 一定要和上面的 dimensions 一致，不然会报错
  elasticsearch:
    uris: http://localhost:9200

rag:
  retrieval:
    # 首轮以 0.5 为保守起点，后续继续用正例/拒答集校准，避免只凭单题调整。
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.5}
  embedding:
    connect-timeout: ${RAG_EMBEDDING_CONNECT_TIMEOUT:5s}
    read-timeout: ${RAG_EMBEDDING_READ_TIMEOUT:20s}
  rate-limit:
    # RAG 会消耗 Embedding 与生成 Token，因此匿名接口默认启用速率和并发双重保护。
    enabled: ${RAG_RATE_LIMIT_ENABLED:true}
    anonymous-permits-per-minute: ${RAG_ANONYMOUS_PERMITS_PER_MINUTE:10}
    authenticated-permits-per-minute: ${RAG_AUTHENTICATED_PERMITS_PER_MINUTE:30}
    max-concurrent-per-subject: ${RAG_MAX_CONCURRENT_PER_SUBJECT:2}
    concurrency-lease: ${RAG_CONCURRENCY_LEASE:3m}
    retry-after: ${RAG_RATE_LIMIT_RETRY_AFTER:60s}

canal:
  enabled: true
  host: localhost
  port: 11111
  destination: example
  username: ${CANAL_USERNAME:}
  password: ${CANAL_PASSWORD:}
  filter: zhiguang\.outbox
  batchSize: 1000
  intervalMs: 1000

counter:
  rebuild:
    enabled: false
    lock:
      ttl-ms: 5000
      watchdog-ms: 30000
    rate:
      permits: 3
      window-seconds: 10
    backoff:
      base-ms: 500
      max-ms: 30000

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

auth:
  jwt:
    issuer: zhiguang
    key-id: zhiguang-key
    private-key: classpath:keys/private.pem
    public-key: classpath:keys/public.pem
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  verification:
    code-length: 6
    ttl: PT5M
    max-attempts: 5
    send-interval: PT60S
    daily-limit: 10
  password:
    bcrypt-strength: 12
    min-length: 8

logging:
  level:
    root: INFO
    '[com.tongji]': DEBUG

oss:
  endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket: ${OSS_BUCKET:}
  public-domain: ${OSS_PUBLIC_DOMAIN:}
  folder: ${OSS_FOLDER:avatars}

cache:
  l2:
    public-cfg:
      ttl-seconds: 15
      max-size: 1000
    mine-cfg:
      ttl-seconds: 10
      max-size: 1000
  hotkey:
    window-seconds: 60
    segment-seconds: 10
    level-low: 50
    level-medium: 200
    level-high: 500
    extend-low-seconds: 20
    extend-medium-seconds: 60
    extend-high-seconds: 120
