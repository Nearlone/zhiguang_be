components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 登录或注册成功后返回的 accessToken。

  parameters:
    KnowPostId:
      name: id
      in: path
      required: true
      description: 知文 ID。源码中接收 long，文档示例按字符串展示以避免前端大整数精度问题。
      schema:
        type: string
        pattern: "^\\d+$"
      example: "{{postId}}"
    ToUserId:
      name: toUserId
      in: query
      required: true
      description: 目标用户 ID
      schema:
        type: integer
        format: int64
      example: "{{targetUserId}}"
    UserId:
      name: userId
      in: query
      required: true
      description: 用户 ID
      schema:
        type: integer
        format: int64
      example: "{{userId}}"
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0
    Cursor:
      name: cursor
      in: query
      required: false
      description: 游标，毫秒时间戳；传入时优先走游标分页。
      schema:
        type: integer
        format: int64
      example: 1720752000000

  requestBodies:
    ActionRequestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ActionRequest"
          examples:
            knowpost:
              value:
                entityType: knowpost
                entityId: "{{postId}}"

  responses:
    BadRequest:
      description: 业务异常或参数校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            badRequest:
              value:
                code: BAD_REQUEST
                message: 请求参数错误
            identifierExists:
              value:
                code: IDENTIFIER_EXISTS
                message: 账号已存在
            invalidCredentials:
              value:
                code: INVALID_CREDENTIALS
                message: 登录凭证错误
    Unauthorized:
      description: 未认证或 Bearer JWT 无效/过期

  examples:
    TokenSuccess:
      value:
        accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6InpoaWd1YW5nLWtleSJ9.xxx.yyy
        accessTokenExpiresAt: "2026-07-12T10:15:00Z"
        refreshToken: eyJhbGciOiJSUzI1NiIsImtpZCI6InpoaWd1YW5nLWtleSJ9.rrr.sss
        refreshTokenExpiresAt: "2026-07-19T10:00:00Z"
    AuthSuccess:
      value:
        user:
          id: 100
          nickname: 知光用户abcd1234
          avatar: https://static.zhiguang.cn/default-avatar.png
          phone: "13800000001"
          zhId: null
          birthday: null
          school: null
          bio: null
          gender: null
          tagJson: "[]"
        token:
          accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6InpoaWd1YW5nLWtleSJ9.xxx.yyy
          accessTokenExpiresAt: "2026-07-12T10:15:00Z"
          refreshToken: eyJhbGciOiJSUzI1NiIsImtpZCI6InpoaWd1YW5nLWtleSJ9.rrr.sss
          refreshTokenExpiresAt: "2026-07-19T10:00:00Z"
    Profile:
      value:
        id: 100
        nickname: 宋同学
        avatar: https://static.zhiguang.cn/default-avatar.png
        bio: AI 应用工程师实习准备中
        zgId: song_ai_2026
        gender: UNKNOWN
        birthday: "2002-01-01"
        school: 同济大学
        phone: "13800000001"
        email: null
        tagJson: "[\"Java\",\"AI应用\",\"RAG\"]"
    FeedPage:
      value:
        items:
          - id: "1950000000000000000"
            title: Spring Security JWT 认证链路总结
            description: 从过滤链到 Resource Server 的完整认证链路
            coverImage: https://cdn.zhiguang.cn/posts/1950000000000000000/images/cover.png
            tags:
              - Java
              - JWT
            authorAvatar: https://static.zhiguang.cn/default-avatar.png
            authorNickname: 宋同学
            tagJson: "[\"Java\",\"AI应用\"]"
            likeCount: 12
