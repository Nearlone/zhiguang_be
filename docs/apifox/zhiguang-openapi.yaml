    KnowPostDetail:
      value:
        id: "1950000000000000000"
        title: Spring Security JWT 认证链路总结
        description: 从过滤链到 Resource Server 的完整认证链路
        contentUrl: https://cdn.zhiguang.cn/posts/1950000000000000000/content.md
        images:
          - https://cdn.zhiguang.cn/posts/1950000000000000000/images/cover.png
        tags:
          - Java
          - Spring Security
          - JWT
        authorId: "100"
        authorAvatar: https://static.zhiguang.cn/default-avatar.png
        authorNickname: 宋同学
        authorTagJson: "[\"Java\",\"AI应用\"]"
