        favoriteCount: 3
        liked: false
        faved: false
        isTop: false
        visible: public
        type: image_text
        publishTime: "2026-07-12T10:00:00Z"

  schemas:
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - IDENTIFIER_EXISTS
            - IDENTIFIER_NOT_FOUND
            - ZGID_EXISTS
            - VERIFICATION_RATE_LIMIT
            - VERIFICATION_DAILY_LIMIT
            - VERIFICATION_NOT_FOUND
            - VERIFICATION_MISMATCH
            - VERIFICATION_TOO_MANY_ATTEMPTS
            - INVALID_CREDENTIALS
            - PASSWORD_POLICY_VIOLATION
            - TERMS_NOT_ACCEPTED
            - REFRESH_TOKEN_INVALID
            - BAD_REQUEST
            - INTERNAL_ERROR
        message:
          type: string

    IdentifierType:
      type: string
      enum:
        - PHONE
        - EMAIL

    VerificationScene:
      type: string
      enum:
        - REGISTER
        - LOGIN
        - RESET_PASSWORD

    Visible:
      type: string
      enum:
        - public
        - followers
        - school
        - private
        - unlisted

    SendCodeRequest:
      type: object
      required:
        - scene
        - identifierType
        - identifier
      properties:
        scene:
          $ref: "#/components/schemas/VerificationScene"
        identifierType:
          $ref: "#/components/schemas/IdentifierType"
        identifier:
          type: string
          description: 手机号或邮箱

    SendCodeResponse:
      type: object
      required:
        - identifier
        - scene
        - expireSeconds
      properties:
        identifier:
          type: string
        scene:
          $ref: "#/components/schemas/VerificationScene"
        expireSeconds:
          type: integer
          format: int32
          example: 300

    RegisterRequest:
      type: object
      required:
        - identifierType
        - identifier
        - code
        - agreeTerms
      properties:
        identifierType:
          $ref: "#/components/schemas/IdentifierType"
        identifier:
          type: string
        code:
          type: string
        password:
          type: string
          description: 可选；提供时至少 8 位，且必须包含字母和数字。
          minLength: 8
        agreeTerms:
          type: boolean
          description: 必须为 true。

    LoginRequest:
      type: object
      required:
        - identifierType
        - identifier
      properties:
        identifierType:
          $ref: "#/components/schemas/IdentifierType"
        identifier:
          type: string
        code:
          type: string
          description: 验证码登录时填写。
        password:
          type: string
          description: 密码登录时填写。

    TokenRefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    LogoutRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    PasswordResetRequest:
      type: object
      required:
        - identifierType
        - identifier
        - code
        - newPassword
      properties:
        identifierType:
          $ref: "#/components/schemas/IdentifierType"
        identifier:
          type: string
        code:
          type: string
        newPassword:
          type: string
          minLength: 8
          description: 至少 8 位，且必须包含字母和数字。

    TokenResponse:
      type: object
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: 默认 15 分钟后过期。
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: 默认 7 天后过期。

    AuthUserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
        avatar:
          type: string
          format: uri
          nullable: true
        phone:
          type: string
          nullable: true
        zhId:
          type: string
          nullable: true
          description: 认证响应字段名为 zhId；个人资料响应字段名为 zgId。
        birthday:
          type: string
          format: date
          nullable: true
        school:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
        tagJson:
          type: string
          nullable: true

    AuthResponse:
      type: object
      required:
        - user
        - token
      properties:
        user:
          $ref: "#/components/schemas/AuthUserResponse"
        token:
          $ref: "#/components/schemas/TokenResponse"

    KnowPostDraftCreateResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: 新草稿 ID。

    KnowPostPublishResponse:
      type: object
      required:
        - postId
        - publishStatus
        - ragIndexStatus
        - ragMessage
      properties:
        postId:
          type: string
        publishStatus:
          type: string
          enum: [PUBLISHED]
        ragIndexStatus:
          type: string
          enum: [PENDING]
        ragMessage:
          type: string

    RagIndexStatusResponse:
      type: object
      required:
        - postId
        - status
        - chunkCount
        - message
      properties:
        postId:
          type: string
        status:
          type: string
          enum: [NOT_INDEXED, PENDING, INDEXING, READY, FAILED, SKIPPED]
        chunkCount:
          type: integer
          format: int32
        indexedAt:
          type: string
          format: date-time
